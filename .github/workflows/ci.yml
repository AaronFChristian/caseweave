name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: caseweave
          POSTGRES_PASSWORD: caseweave_dev
          POSTGRES_DB: caseweave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caseweave"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --all-extras

      - name: lint
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests

      - name: types
        run: uv run mypy src

      - name: security
        run: |
          uv run bandit -q -r src -c pyproject.toml
          uv run pip-audit --strict || true

      - name: tests
        run: uv run pytest --cov=caseweave --cov-report=term-missing --cov-fail-under=60

      # The pipeline must reproduce identically from the seed. Drift here means
      # an eval baseline is about to become meaningless without anyone noticing.
      - name: day 1 reproducibility gate
        env:
          POSTGRES_DSN: postgresql://caseweave:caseweave_dev@localhost:5432/caseweave
        run: |
          uv run python scripts/pipeline.py all --direct --no-graph
          uv run python scripts/verify_day1.py

      # Entirely offline — mocked LLM, no ANTHROPIC_API_KEY, no token spend.
      - name: day 2 acceptance gate
        run: uv run python scripts/verify_day2.py

      # Golden-set backtest in mock mode. This guards the harness and
      # guardrail WIRING against regression on every PR — it does not (and
      # cannot, without spending money on every commit) test live model
      # quality. A separate manually-triggered workflow with a real API key
      # in repo secrets is the honest place for a live quality gate; see
      # the commented job below for what that looks like.
      - name: day 3 golden-set eval gate (mock)
        run: |
          uv run python scripts/build_golden_set.py
          uv run python scripts/run_evals.py --fail-under 0.80

  # Honest note on live quality gating: the job above runs the eval harness
  # in mock mode, which tests wiring, not model quality. A real quality gate
  # needs a live run, which costs money on every PR — not something to do
  # unconditionally. The documented approach: a manually-triggered or
  # nightly-scheduled workflow using a repo secret ANTHROPIC_API_KEY_EVAL,
  # gated separately from the PR-blocking mock gate above. Sketch:
  #
  # live-evals:
  #   if: github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/setup-uv@v5
  #     - run: uv sync --all-extras
  #     - run: uv run python scripts/run_evals.py --live --fail-under 0.90
  #       env:
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
