[project]
name = "caseweave"
version = "0.1.0"
description = "Agentic AML investigation copilot: alert triage, graph evidence assembly, attributed SAR narrative drafting"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<19",
    "duckdb>=1.1,<2",
    "river>=0.21,<0.23",
    "neo4j>=5.25,<6",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3.6,<0.5",
    "confluent-kafka>=2.5,<3",
    "sentence-transformers>=3.1,<6",
    "python-dotenv>=1.0,<2",
    "langgraph>=0.2,<0.7",
    "langgraph-checkpoint>=2.0,<3",
    "litellm>=1.50,<2",
    "anthropic>=0.40,<1",
    "mcp[cli]>=1.2,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langsmith>=0.10,<1",
    "logfire[fastapi]>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.7,<0.13",
    "mypy>=1.11,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.8,<5",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseweave"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "BLE"]
ignore = ["S101", "E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
"scripts/*" = ["E402"]
"src/caseweave/generator/*" = ["S311"]   # stdlib random is correct for synthetic data
"src/caseweave/scoring/rules.py" = ["S608"]  # SQL is f-string built from config constants, never user input
"scripts/verify_day2.py" = ["S603", "S607"]  # subprocess call is a fixed, hardcoded pytest invocation
"scripts/doctor.py" = ["S603", "S607"]  # subprocess calls are fixed, hardcoded docker/npm invocations
"src/caseweave/agents/tools.py" = ["BLE001"]  # every broad except is a deliberate degrade-gracefully catch: a store outage means less evidence, not a crash
"src/caseweave/observability/tracing.py" = ["BLE001"]  # tracing must never be able to take the app down; any failure here is deliberately caught broadly

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",  # assert is used deliberately throughout for graph-state
             # invariant narrowing (the same pattern mypy's own errors
             # pointed to) and for internal test assertions. Never used to
             # enforce a security boundary against untrusted input.
    "B608",  # every f-string SQL query in this codebase is built from
             # internal config constants (RULE_*_THRESHOLD etc.) or an
             # allowlisted table-name helper (db/duck.py's TABLES
             # frozenset + _checked()) — never from user-supplied input.
             # Reviewed per-instance. ruff's matching S608 rule is already
             # suppressed for the same reason via per-file-ignores above;
             # bandit does not read ruff's noqa comments, so it needs this
             # explicit, separately-documented skip.
]

[tool.ruff.format]
skip-magic-trailing-comma = true
